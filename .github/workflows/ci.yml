name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check .

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cliente-python/requirements.txt -r tests/requirements.txt
      - name: Compile sources
        run: python -m compileall cliente-python
      - name: Run client tests
        run: pytest

  test-api-django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api-django/requirements.txt
      - name: Check migrations
        working-directory: api-django
        run: python manage.py migrate --check || python manage.py migrate
      - name: Run Django tests
        working-directory: api-django
        run: pytest

  test-fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r microservicio-fastapi/requirements.txt
      - name: Run microservice tests
        working-directory: microservicio-fastapi
        run: pytest

  compile-modelo-ia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r modelo-ia/requirements.txt
      - name: Compile sources
        run: python -m compileall modelo-ia/src
